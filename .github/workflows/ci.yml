name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run backend tests
        run: uv run --locked pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  docker-smoke:
    name: Docker clean-start and persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify frontend, API and SQLite persistence after restart
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import uuid

          def request(url, method="GET", payload=None, cookie=None):
              body = json.dumps(payload).encode() if payload is not None else None
              headers = {"Content-Type": "application/json"} if body is not None else {}
              if cookie:
                  headers["Cookie"] = cookie
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              return urllib.request.urlopen(req, timeout=5)

          for url in ("http://127.0.0.1:5173/", "http://127.0.0.1:8000/api/health"):
              for attempt in range(30):
                  try:
                      with request(url) as response:
                          if response.status != 200:
                              raise RuntimeError(f"Unexpected status for {url}: {response.status}")
                          if url.endswith("/api/health") and json.load(response).get("status") != "ok":
                              raise RuntimeError("Backend health check did not return ok")
                      break
                  except (OSError, urllib.error.URLError):
                      if attempt == 29:
                          raise
                      time.sleep(2)

          email = f"ci-{uuid.uuid4().hex}@example.test"
          with request("http://127.0.0.1:8000/api/auth/register", "POST", {
              "name": "CI persistence check",
              "email": email,
              "password": "ci-persistence-password-123",
          }) as response:
              cookie_header = response.headers.get("Set-Cookie", "")
          cookie = cookie_header.split(";", 1)[0]
          if not cookie:
              raise RuntimeError("Registration did not set an authentication cookie")

          subprocess.run(["docker", "compose", "restart", "backend"], check=True)
          for attempt in range(30):
              try:
                  with request("http://127.0.0.1:8000/api/health") as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  if attempt == 29:
                      raise
                  time.sleep(2)

          with request("http://127.0.0.1:8000/api/auth/me", cookie=cookie) as response:
              user = json.load(response)
          if user.get("email") != email:
              raise RuntimeError("SQLite session/user did not survive the backend restart")
          PY
      - name: Stop stack and remove its test volume
        if: always()
        run: docker compose down --volumes --remove-orphans
