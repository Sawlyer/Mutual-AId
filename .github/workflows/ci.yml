name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run backend tests
        run: uv run --locked pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  docker-smoke:
    name: Docker clean-start and persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify frontend, API and SQLite persistence after restart
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import uuid

          def request(url, method="GET", payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              headers = {"Content-Type": "application/json"} if body is not None else {}
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              return urllib.request.urlopen(req, timeout=5)

          for url in ("http://127.0.0.1:5173/", "http://127.0.0.1:8000/api/health"):
              for attempt in range(30):
                  try:
                      with request(url) as response:
                          if response.status != 200:
                              raise RuntimeError(f"Unexpected status for {url}: {response.status}")
                          if url.endswith("/api/health") and json.load(response).get("status") != "ok":
                              raise RuntimeError("Backend health check did not return ok")
                      break
                  except (OSError, urllib.error.URLError):
                      if attempt == 29:
                          raise
                      time.sleep(2)

          with request("http://127.0.0.1:8000/api/conversations", "POST", {}) as response:
              conversation = json.load(response)
          conversation_id = conversation.get("id")
          if not conversation_id:
              raise RuntimeError("Conversation creation did not return an id")
          title = f"CI persistence check {uuid.uuid4().hex}"
          with request(
              f"http://127.0.0.1:8000/api/conversations/{conversation_id}",
              "PATCH",
              {"title": title},
          ) as response:
              if json.load(response).get("title") != title:
                  raise RuntimeError("Conversation title was not saved")

          subprocess.run(["docker", "compose", "restart", "backend"], check=True)
          for attempt in range(30):
              try:
                  with request("http://127.0.0.1:8000/api/health") as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  if attempt == 29:
                      raise
                  time.sleep(2)

          with request("http://127.0.0.1:8000/api/conversations") as response:
              conversations = json.load(response)
          persisted = next((item for item in conversations if item.get("id") == conversation_id), None)
          if not persisted or persisted.get("title") != title:
              raise RuntimeError("SQLite conversation did not survive the backend restart")
          PY
      - name: Stop stack and remove its test volume
        if: always()
        run: docker compose down --volumes --remove-orphans
